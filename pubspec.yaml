name: video_player_example
description: ARNIX TV — IPTV-плеер для Android и Android TV.
publish_to: none
version: 6.0.1+601

environment:
  sdk: ^3.1.0
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.8.2

  get_it: ^7.6.7
  mobx: ^2.3.3+1
  flutter_mobx: ^2.2.1+1

  xml: ^6.5.0
  collection: ^1.18.0
  json_annotation: ^4.8.1
  package_info_plus: ^4.2.0
  retry: ^3.1.2
  pretty_qr_code: ^3.3.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1
  html: ^0.15.0
  talker: ^4.1.3
  talker_flutter: ^4.1.3
  shared_preferences: ^2.2.2
  flutter_screenutil: ^5.9.0
  intl: ^0.18.1
  path_provider: any

dev_dependencies:
  build_runner: ^2.1.10
  test: any
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/web/
    - assets/images/
